# Solo para desarrollo local. En producción la base vive en Coolify.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ccvida
      POSTGRES_PASSWORD: ccvida
      POSTGRES_DB: ccvida
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
